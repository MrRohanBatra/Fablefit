spring:
  application:
    name: identity
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: ${IDENTITY_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${IDENTITY_DB_SCHEMA:identity}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${IDENTITY_JWT_ISSUER_URI:http://localhost:8081}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}


fablefit:
  seeder:
    tenantKey: platform
    tenantName: fablefit owner tenant
    ownerEmail: owner@fablefit.com
    ownerPassword: RohanIsGreat