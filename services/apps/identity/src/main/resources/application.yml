spring:
  application:
    name: identity
  profiles:
    default: local
  jpa:
    hibernate:
      ddl-auto: ${IDENTITY_DDL_AUTO:update}
    open-in-view: false
    properties:
      hibernate:
        default_schema: ${IDENTITY_DB_SCHEMA:identity}
  security:
    oauth2:
      resourceserver:
        jwt:
          public-key-location: ${IDENTITY_JWT_PUBLIC_KEY:classpath:certs/public.pem}

management:
  endpoints:
    web:
      exposure:
        include: health,info

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  version: ${APP_VERSION:0.1.0-SNAPSHOT}

fablefit:
  seeder:
    tenantKey: platform
    tenantName: fablefit owner tenant
    ownerEmail: owner@fablefit.com
    ownerPassword: RohanIsGreat
  security:
    jwt-issuer: ${IDENTITY_JWT_ISSUER:fablefit-identity}
    jwt-expiresIn: ${IDENTITY_JWT_EXPIRES_IN:900}
    expiresIn: ${IDENTITY_JWT_EXPIRES_IN:900}
    rsa:
      private-key: ${IDENTITY_JWT_PRIVATE_KEY:classpath:certs/private.pem}
      public-key: ${IDENTITY_JWT_PUBLIC_KEY:classpath:certs/public.pem}