spring:
  application:
    name: gateway
  profiles:
    default: local
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${GATEWAY_JWT_ISSUER_URI:http://localhost:8081}
  cloud:
    gateway:
      server:
        webmvc:
          routes:
            - id: identity
              uri: ${IDENTITY_SERVICE_URL:http://localhost:8081}
              predicates:
                - Path=/api/identity/**
              filters:
                - StripPrefix=2
            - id: commerce
              uri: ${COMMERCE_SERVICE_URL:http://localhost:8082}
              predicates:
                - Path=/api/commerce/**
              filters:
                - StripPrefix=2

management:
  endpoints:
    web:
      exposure:
        include: health,info,gateway

springdoc:
  swagger-ui:
    path: /swagger-ui.html
